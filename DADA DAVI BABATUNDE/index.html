<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Dada's Tech</title>

    <link rel="stylesheet" href="dadatec.css">
</head>

<body class="auth-page">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="auth-box">

        <!-- Logo / Brand -->
        <div class="brand">
            <img src="img.jpg" alt="Dada's Tech Logo" class="auth-logo">

            <h1>Dada's <span>Tech</span></h1>

            <p>Innovating Technology, Building the Future</p>
        </div>

        <!-- Heading -->
        <div class="auth-heading">
            <h2>Create Account</h2>
            <p>Join Dada's Tech today</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm">

            <div class="input-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="signupEmail">Email Address</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="signupPassword">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('signupPassword', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </label>
            </div>

            <!-- Create Account -->
            <button type="submit" class="signup-btn">
                Create Account
                <span>→</span>
            </button>

        </form>

        <!-- Login -->
        <p class="account-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <!-- Back -->
        <a href="login.html" class="back-home">
            ← Back to Login
        </a>

        <!-- Footer -->
        <div class="auth-footer">
            <p>© 2026 Dada's Tech. All Rights Reserved.</p>
        </div>

    </div>


    <script>
        // Show / Hide Password
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }


        // Create Account
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("signupEmail").value.trim().toLowerCase();
            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Check password
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            // Password length
            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            // Check if account already exists
            const existingAccount = JSON.parse(localStorage.getItem("dadaTechAccount"));

            if (existingAccount && existingAccount.email === email) {
                alert("An account with this email already exists. Please login.");
                window.location.href = "login.html";
                return;
            }

            // Save account
            const account = {
                fullName: fullName,
                email: email,
                password: password
            };

            localStorage.setItem("dadaTechAccount", JSON.stringify(account));

            // Send user to login
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
