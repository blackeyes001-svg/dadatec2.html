<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Dada's Tech</title>

    <link rel="stylesheet" href="CSS/dadatec.css">
</head>

<body class="auth-page">

    <!-- Background decorative elements -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="auth-box">

        <!-- Logo / Brand -->
        <div class="brand">
            <img src="img.jpg" alt="Dada's Tech Logo" class="auth-logo">

            <h1>Dada's <span>Tech</span></h1>

            <p>Innovating Technology, Building the Future</p>
        </div>

        <!-- Heading -->
        <div class="auth-heading">
            <h2>Create Account</h2>
            <p>Join Dada's Tech today</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm">

            <div class="input-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="signupEmail">Email Address</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="signupPassword">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('signupPassword', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>
                </div>
            </div>

            <!-- Terms -->
            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </label>
            </div>

            <!-- Create Account Button -->
            <button type="submit" class="signup-btn">
                Create Account
                <span>→</span>
            </button>

        </form>

        <!-- Login -->
        <p class="account-text">
            Already have an account?
            <a href="dadatec2.html">Login</a>
        </p>

        <!-- Back -->
        <a href="loz.html" class="back-home">
            ← Back to Dada's Tech
        </a>

        <!-- Footer -->
        <div class="auth-footer">
            <p>© 2026 Dada's Tech. All Rights Reserved.</p>
        </div>

    </div>

    <script src="JS/dada.js"></script>

    <script>
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }
    </script>

</body>
</html>
