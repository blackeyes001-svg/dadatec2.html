<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Dada's Tech</title>

    <link rel="stylesheet" href="CSS/dadatec.css">
</head>

<body class="auth-page">

    <div class="auth-box">

        <h2>Create Account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="fullName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="dadatec2.html">Login</a>
        </p>

        <p>
            <a href="loz.html">← Back to Dada's Tech</a>
        </p>

    </div>

    <script src="JS/dada.js"></script>

</body>
</html>
